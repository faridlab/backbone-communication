components:
  schemas:
    Message:
      type: object
      required:
        - id
        - thread_id
        - company_id
        - direction
        - channel
        - body
        - status
        - occurred_at
        - metadata
      properties:
        id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        direction:
          type: string
        channel:
          type: string
        external_id:
          nullable: true
          type: string
        address_from:
          nullable: true
          type: string
        address_to:
          nullable: true
          type: string
        body:
          type: string
        status:
          type: string
        failure_reason:
          nullable: true
          type: string
        occurred_at:
          type: string
          format: date-time
        metadata:
          type: object

    MessageBulkResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        total: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items: { type: string }

    CreateMessageRequest:
      type: object
      required:
        - thread_id
        - company_id
        - direction
        - channel
        - body
        - status
        - occurred_at
        - metadata
      properties:
        thread_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        direction:
          type: string
        channel:
          type: string
        external_id:
          nullable: true
          type: string
        address_from:
          nullable: true
          type: string
        address_to:
          nullable: true
          type: string
        body:
          type: string
        status:
          type: string
        failure_reason:
          nullable: true
          type: string
        occurred_at:
          type: string
          format: date-time
        metadata:
          type: object

    UpdateMessageRequest:
      type: object
      required:
        - thread_id
        - company_id
        - direction
        - channel
        - body
        - status
        - occurred_at
        - metadata
      properties:
        thread_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        direction:
          type: string
        channel:
          type: string
        external_id:
          nullable: true
          type: string
        address_from:
          nullable: true
          type: string
        address_to:
          nullable: true
          type: string
        body:
          type: string
        status:
          type: string
        failure_reason:
          nullable: true
          type: string
        occurred_at:
          type: string
          format: date-time
        metadata:
          type: object

    PatchMessageRequest:
      type: object
      properties:
        thread_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        direction:
          type: string
        channel:
          type: string
        external_id:
          nullable: true
          type: string
        address_from:
          nullable: true
          type: string
        address_to:
          nullable: true
          type: string
        body:
          type: string
        status:
          type: string
        failure_reason:
          nullable: true
          type: string
        occurred_at:
          type: string
          format: date-time
        metadata:
          type: object

    MessageList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    Thread:
      type: object
      required:
        - id
        - company_id
        - channel
        - status
        - metadata
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        channel:
          type: string
        party_id:
          nullable: true
          type: string
          format: uuid
        subject_type:
          nullable: true
          type: string
        subject_id:
          nullable: true
          type: string
          format: uuid
        external_ref:
          nullable: true
          type: string
        status:
          type: string
        last_message_at:
          nullable: true
          type: string
          format: date-time
        metadata:
