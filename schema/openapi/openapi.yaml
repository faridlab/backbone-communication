      properties:
        company_id:
          type: string
          format: uuid
        channel:
          type: string
        party_id:
          nullable: true
          type: string
          format: uuid
        subject_type:
          nullable: true
          type: string
        subject_id:
          nullable: true
          type: string
          format: uuid
        external_ref:
          nullable: true
          type: string
        status:
          type: string
        last_message_at:
          nullable: true
          type: string
          format: date-time
        metadata:
